<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cambiar contenido con JavaScript</title>

</head>

<body>

    <h1 id="titulo">¡Bienvenido a mi página!</h1>

    <p id="parrafo">Este es el contenido inicial.</p>

    <button id="cambiarContenido">Cambiar Contenido</button>

    <script>
        
        let titulo = document.getElementById('titulo');
        let parrafo = document.getElementById('parrafo');
        let boton = document.getElementById('cambiarContenido');

        boton.addEventListener('click', function() {
            
            if (titulo.innerHTML === '¡Bienvenido a mi página!'){
                //Estado A: Si dice "¡Bienvenido a mi página!", lo cambiamos a "¡Contenido Actualizado!" y el párrafo a "Has hecho clic en el botón!"
                titulo.innerHTML = '¡Contenido Actualizado!';
                parrafo.innerHTML = 'Has hecho clic en el botón!';
            } else{
                //Estado B: Si dice "¡Contenido Actualizado!", lo cambiamos a "¡Bienvenido a mi página!" y el párrafo a "Este es el contenido inicial."
                titulo.innerHTML = '¡Bienvenido a mi página!';
                parrafo.innerHTML = 'Este es el contenido inicial.';
            }
        });
    </script>

</body>

</html>
