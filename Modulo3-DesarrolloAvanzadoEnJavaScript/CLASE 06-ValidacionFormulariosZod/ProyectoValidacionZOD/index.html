<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validación con Zod</title>
  <!-- Importamos la librería Zod -->
  <script src="https://cdn.jsdelivr.net/npm/zod@3.21.4/lib/index.umd.min.js"></script>
</head>
<body>
  <h1>Registro de Usuario</h1>
  
  <form id="registerForm">
    <label for="name">Nombre:</label>
    <input type="text" id="name" placeholder="Tu nombre" required /><br /><br />
    
    <label for="email">Correo Electrónico:</label>
    <input type="email" id="email" placeholder="Tu correo" required /><br /><br />
    
    <label for="password">Contraseña:</label>
    <input type="password" id="password" placeholder="Contraseña" required /><br /><br />
    
    <button type="submit">Registrar</button>
  </form>
  
  <!-- Contenedor donde JavaScript inyectará los mensajes de error -->
  <p id="errors" style="color: red; font-weight: bold;"></p>

  <!-- Conectamos nuestro archivo de lógica -->
  <script src="app.js"></script>
</body>
</html>
