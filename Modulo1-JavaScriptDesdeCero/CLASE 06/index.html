<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section class="reproductor">
        <video id="video">
            <source src="video.mp4" type="video/mp4">
        </video>
    </section>

    <section class="controles">
        <input type="range" id="progreso" value="0" min="0" max="100">
        <section class="botones">
            <div class="izquierda">
                <button onclick="reproducirPausar()">⏸️</button>
                <button onclick="retrasar()">⏪</button>
                <button onclick="adelantar()">⏩</button>
            
                <span id="tiempo">00:00/00:00</span>
            </div>
            <div class="derecha">
                <input type="range" id="volumen" min="0" max="1" step="0.1" value="1">
            
                <button onclick="pantallaCompleta()">[ ]</button>
            </div>
        </section>
    </section>

</body>
</html>
